<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPICS DSN3099: Integrated Road Intelligence & Predictive Mapping Center</title>
    <!-- Leaflet & Plotly CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent-blue: #38bdf8;
            --tier1: #10b981;
            --tier2: #f59e0b;
            --tier3: #ef4444;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-dark);
            color: #f8fafc;
            overflow: hidden;
        }
        #topbar {
            background: var(--card-bg);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            height: 52px;
            box-sizing: border-box;
        }
        .brand {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: var(--accent-blue); }
        .forecast-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #0f172a;
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .forecast-controls label {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }
        #timeSlider {
            accent-color: var(--accent-blue);
            width: 140px;
        }
        .slider-val {
            font-size: 13px;
            font-weight: bold;
            color: var(--accent-blue);
            min-width: 75px;
        }
        #main {
            display: flex;
            height: calc(100vh - 52px);
        }
        #map-container {
            flex: 1;
            height: 100%;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        #right-panel {
            width: 440px;
            background: var(--card-bg);
            border-left: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .hazard-card {
            background: #0f172a;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
            border-left: 5px solid #64748b;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }
        .hazard-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-blue);
        }
        .hazard-card.tier1 { border-left-color: var(--tier1); }
        .hazard-card.tier2 { border-left-color: var(--tier2); }
        .hazard-card.tier3 { border-left-color: var(--tier3); }
        .card-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .badge {
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge.green { background: rgba(16, 185, 129, 0.2); color: var(--tier1); }
        .badge.yellow { background: rgba(245, 158, 11, 0.2); color: var(--tier2); }
        .badge.red { background: rgba(239, 68, 68, 0.2); color: var(--tier3); }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 800px;
            height: 540px;
            padding: 20px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
        }
        .modal-close:hover { color: #ffffff; }
    </style>
</head>
<body>

<div id="topbar">
    <div class="brand">
        EPICS DSN3099 <span>Integrated Mapping & Predictive Intelligence</span>
    </div>
    
    <div class="forecast-controls">
        <label>Degradation Forecast Horizon:</label>
        <input type="range" id="timeSlider" min="0" max="90" step="30" value="0" oninput="updateForecastHorizon(this.value)" />
        <div class="slider-val" id="sliderValDisplay">Day 0 (Now)</div>
    </div>
    
    <div style="font-size: 12px; color: #94a3b8;">
        Live Consumer Video & Sensor Telemetry
    </div>
</div>

<div id="main">
    <div id="map-container">
        <div id="map"></div>
    </div>
    
    <div id="right-panel">
        <div class="panel-header">
            <span>Road Safety & Degradation Registry</span>
            <span id="hazard-count-badge" class="badge green">Active Potholes</span>
        </div>
        <div class="panel-scroll" id="hazardList"></div>
    </div>
</div>

<!-- Modal for 3D Pothole Inspection -->
<div class="modal-overlay" id="potholeModal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle" style="margin-top: 0; font-size: 16px;">3D Reconstructed Pothole Surface</h3>
        <div id="plotly3d" style="width: 100%; height: 460px;"></div>
    </div>
</div>

<script>
    const map = L.map('map').setView([12.983314270280392, 79.16761863731493], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 19
    }).addTo(map);

    const trajectory = [[12.9716, 79.1585], [12.972360761468174, 79.15906569462173], [12.972901858129676, 79.15955363731304], [12.973865196284066, 79.16020182242801], [12.97459960351112, 79.16094462598986], [12.975659601969824, 79.16184045953693], [12.976090239507217, 79.16228695728881], [12.976596352379458, 79.16294096556054], [12.97732355978999, 79.16365672377052], [12.978362926758992, 79.16403929004225], [12.97926880187139, 79.16454960144044], [12.980044611172382, 79.16500592077249], [12.98094252365684, 79.1657029521854], [12.98199064212082, 79.16643350584633], [12.982591081496397, 79.16684100904905], [12.983458734248913, 79.1676729599846], [12.984407835935135, 79.16858311976229], [12.985334847788742, 79.16917136157235], [12.986292299275183, 79.16993634718132], [12.987396731645463, 79.17051678848266], [12.988234300096709, 79.17101967719601], [12.988951684259522, 79.17154518222934], [12.98969850664027, 79.17225700521605], [12.99066483691564, 79.17300179392674], [12.991465046922622, 79.174119881128], [12.992140927866325, 79.1745468803856], [12.993181796739975, 79.17529222153405], [12.994082854470586, 79.17569683616348], [12.99476963000576, 79.17641850780828], [12.995150315484567, 79.1772173910317]];
    L.polyline(trajectory, {
        color: '#38bdf8',
        weight: 5,
        opacity: 0.8
    }).addTo(map);

    const hazards = [{"hazard_id": 1, "latitude": 12.971607, "longitude": 79.158395, "depth_max_cm": 20.0, "width_cm": 126.0, "volume_cm3": 107635.4, "severity_tier": 3, "confidence_score": 0.14, "validation_status": "SUSPICIOUS_OVERESTIMATE", "rqs_penalty": 500.5, "forecast": {"hazard_id": 1, "current_depth_cm": 20.0, "projected_depth_90d": 15.0, "growth_factor": 0.75, "time_to_failure_days": 0, "urgency_level": "HIGH", "maintenance_recommendation": "IMMEDIATE REPAIR: Will become Tier 3 hazard within 30 days", "estimated_delay_cost_escalation_x": 1.0}}, {"hazard_id": 2, "latitude": 12.975686, "longitude": 79.161792, "depth_max_cm": 20.0, "width_cm": 157.2, "volume_cm3": 129111.7, "severity_tier": 3, "confidence_score": 0.47, "validation_status": "SUSPICIOUS_OVERESTIMATE", "rqs_penalty": 586.4, "forecast": {"hazard_id": 2, "current_depth_cm": 20.0, "projected_depth_90d": 15.0, "growth_factor": 0.75, "time_to_failure_days": 0, "urgency_level": "HIGH", "maintenance_recommendation": "IMMEDIATE REPAIR: Will become Tier 3 hazard within 30 days", "estimated_delay_cost_escalation_x": 1.0}}, {"hazard_id": 3, "latitude": 12.98002, "longitude": 79.165022, "depth_max_cm": 20.0, "width_cm": 190.0, "volume_cm3": 675313.6, "severity_tier": 3, "confidence_score": 0.99, "validation_status": "PHYSICALLY_VALIDATED", "rqs_penalty": 2771.3, "forecast": {"hazard_id": 3, "current_depth_cm": 20.0, "projected_depth_90d": 15.0, "growth_factor": 0.75, "time_to_failure_days": 0, "urgency_level": "HIGH", "maintenance_recommendation": "IMMEDIATE REPAIR: Will become Tier 3 hazard within 30 days", "estimated_delay_cost_escalation_x": 1.0}}, {"hazard_id": 4, "latitude": 12.985381, "longitude": 79.169272, "depth_max_cm": 20.0, "width_cm": 192.7, "volume_cm3": 452774.9, "severity_tier": 3, "confidence_score": 0.98, "validation_status": "PHYSICALLY_VALIDATED", "rqs_penalty": 1881.1, "forecast": {"hazard_id": 4, "current_depth_cm": 20.0, "projected_depth_90d": 15.0, "growth_factor": 0.75, "time_to_failure_days": 0, "urgency_level": "HIGH", "maintenance_recommendation": "IMMEDIATE REPAIR: Will become Tier 3 hazard within 30 days", "estimated_delay_cost_escalation_x": 1.0}}, {"hazard_id": 5, "latitude": 12.990641, "longitude": 79.17292, "depth_max_cm": 20.0, "width_cm": 152.7, "volume_cm3": 41012.7, "severity_tier": 3, "confidence_score": 1.0, "validation_status": "PHYSICALLY_VALIDATED", "rqs_penalty": 234.1, "forecast": {"hazard_id": 5, "current_depth_cm": 20.0, "projected_depth_90d": 15.0, "growth_factor": 0.75, "time_to_failure_days": 0, "urgency_level": "HIGH", "maintenance_recommendation": "IMMEDIATE REPAIR: Will become Tier 3 hazard within 30 days", "estimated_delay_cost_escalation_x": 1.0}}];
    let currentHorizonDays = 0;
    const markers = [];

    function renderHazards(days) {
        // Clear previous markers
        markers.forEach(m => map.removeLayer(m));
        markers.length = 0;
        
        const list = document.getElementById('hazardList');
        list.innerHTML = '';

        hazards.forEach(h => {
            // Apply projected growth based on time slider
            let depth = h.depth_max_cm;
            let width = h.width_cm;
            let tier = h.severity_tier;
            
            if (days > 0 && h.forecast) {
                const growthFactor = 1.0 + (days / 90.0) * (h.forecast.growth_factor - 1.0);
                depth = depth * growthFactor;
                width = width * (1.0 + (days / 90.0) * 0.25);
                if (depth >= 6.5) tier = 3;
                else if (depth >= 3.2) tier = 2;
            }

            let color = '#10b981';
            let tierClass = 'tier1';
            let badgeClass = 'green';
            if (tier === 2) { color = '#f59e0b'; tierClass = 'tier2'; badgeClass = 'yellow'; }
            else if (tier === 3) { color = '#ef4444'; tierClass = 'tier3'; badgeClass = 'red'; }

            // Leaflet Circle Marker
            const circle = L.circleMarker([h.latitude, h.longitude], {
                radius: Math.max(6, Math.min(18, depth * 1.8)),
                fillColor: color,
                color: '#ffffff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.85
            }).addTo(map);

            circle.bindPopup(`
                <div style="font-family: sans-serif; color: #0f172a; min-width: 180px;">
                    <h4 style="margin: 0 0 4px 0;">Hazard #${h.hazard_id} [Tier ${tier}]</h4>
                    <div>Depth: <strong>${depth.toFixed(1)} cm</strong></div>
                    <div>Width: <strong>${width.toFixed(1)} cm</strong></div>
                    <div>Forecast (+${days}d): <strong>${depth > h.depth_max_cm ? '+' + (depth - h.depth_max_cm).toFixed(1) + ' cm' : 'Baseline'}</strong></div>
                    <div style="margin-top: 8px;">
                        <button onclick="openModal(${h.hazard_id}, ${depth}, ${width})" 
                                style="background: #0284c7; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px;">
                            Inspect 3D Surface
                        </button>
                    </div>
                </div>
            `);
            markers.push(circle);

            // Sidebar Card
            const card = document.createElement('div');
            card.className = `hazard-card ${tierClass}`;
            card.innerHTML = `
                <div class="card-row">
                    <span style="font-weight: 700;">Hazard #${h.hazard_id}</span>
                    <span class="badge ${badgeClass}">Tier ${tier}</span>
                </div>
                <div class="card-row" style="color: #94a3b8;">
                    <span>Depth: <strong>${depth.toFixed(1)} cm</strong></span>
                    <span>Width: <strong>${width.toFixed(1)} cm</strong></span>
                </div>
                <div class="card-row" style="color: #64748b; font-size: 11px;">
                    <span>Time to Failure: <strong style="color: #f87171;">${h.forecast.time_to_failure_days ? h.forecast.time_to_failure_days + ' days' : '>180 days'}</strong></span>
                    <span>Delay Cost: <strong>${h.forecast.estimated_delay_cost_escalation_x}x</strong></span>
                </div>
                <div style="font-size: 11px; color: #38bdf8; margin-top: 4px;">
                    ${h.forecast.maintenance_recommendation}
                </div>
            `;
            card.onclick = () => {
                map.setView([h.latitude, h.longitude], 16);
                circle.openPopup();
            };
            list.appendChild(card);
        });
    }

    function updateForecastHorizon(val) {
        currentHorizonDays = parseInt(val);
        const label = val == 0 ? "Day 0 (Now)" : `+${val} Days Ahead`;
        document.getElementById('sliderValDisplay').innerText = label;
        renderHazards(currentHorizonDays);
    }

    function openModal(id, depth, width) {
        document.getElementById('modalTitle').innerText = `Pothole #${id} - 3D Surface Topography (Depth: ${depth.toFixed(1)} cm, Width: ${width.toFixed(1)} cm)`;
        document.getElementById('potholeModal').style.display = 'flex';

        // Render mini interactive 3D surface with Plotly inside modal
        const n = 30;
        const x = [], y = [], z = [];
        const w_half = width / 2.0;
        for (let i = 0; i < n; i++) {
            const xi = -w_half + (i / (n - 1)) * width;
            x.push(xi);
            const zi_row = [];
            for (let j = 0; j < n; j++) {
                const yj = -w_half + (j / (n - 1)) * width;
                if (i === 0) y.push(yj);
                const r_sq = (xi / w_half) ** 2 + (yj / w_half) ** 2;
                if (r_sq <= 1.0) {
                    zi_row.push(-depth * (1.0 - r_sq) + (Math.random() - 0.5) * 0.2);
                } else {
                    zi_row.push((Math.random() - 0.5) * 0.1);
                }
            }
            z.push(zi_row);
        }

        Plotly.newPlot('plotly3d', [{
            x: x, y: y, z: z,
            type: 'surface',
            colorscale: 'Viridis'
        }], {
            margin: { l: 0, r: 0, b: 0, t: 0 },
            scene: {
                xaxis: { title: 'Width (cm)' },
                yaxis: { title: 'Length (cm)' },
                zaxis: { title: 'Depth (cm)' },
                camera: { eye: { x: -1.4, y: -1.4, z: 1.1 } }
            }
        }, { responsive: true });
    }

    function closeModal() {
        document.getElementById('potholeModal').style.display = 'none';
    }

    // Initial render
    renderHazards(0);
</script>

</body>
</html>
